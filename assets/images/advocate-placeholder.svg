<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-labelledby="apTitle apDesc" preserveAspectRatio="xMidYMid meet">
  <title id="apTitle">Advocate photograph placeholder</title>
  <desc id="apDesc">A plain silhouette shown in place of an advocate photograph that has not yet been supplied.</desc>

  <defs>
    <linearGradient id="apField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFA"/>
      <stop offset="1" stop-color="#F2F4F6"/>
    </linearGradient>
    <linearGradient id="apFigure" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1B3A57"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <clipPath id="apClip">
      <rect x="0" y="0" width="640" height="800"/>
    </clipPath>
  </defs>

  <rect width="640" height="800" fill="url(#apField)"/>

  <g clip-path="url(#apClip)">
    <!-- Shoulders and torso -->
    <path d="M320 470c104 0 188 66 188 148v182H132V618c0-82 84-148 188-148z" fill="url(#apFigure)"/>

    <!-- Collar opening, reads as a formal band collar -->
    <path d="M320 470c22 0 43 3 62 9l-62 96-62-96c19-6 40-9 62-9z" fill="#FCFCFA" opacity="0.94"/>

    <!-- Narrow teal band at the collar -->
    <path d="M320 575l30-46 12 8-42 64-42-64 12-8z" fill="#16656B"/>

    <!-- Head -->
    <circle cx="320" cy="322" r="118" fill="url(#apFigure)"/>
  </g>

  <!-- Fine gold rules, the only ornament -->
  <rect x="40" y="40" width="560" height="720" fill="none" stroke="#D8C39A" stroke-width="1" opacity="0.75"/>
  <rect x="0" y="794" width="640" height="6" fill="#B78B4A"/>
  <rect x="1" y="1" width="638" height="798" fill="none" stroke="#E4E8EB" stroke-width="2"/>
</svg>
