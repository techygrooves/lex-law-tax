<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-labelledby="placeholderTitle placeholderDesc">
  <title id="placeholderTitle">Advocate photograph placeholder</title>
  <desc id="placeholderDesc">A neutral silhouette shown while the advocate photograph is being prepared.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#e7edf5"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="640" height="800" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="640" height="800" fill="url(#bg)"/>

    <!-- Shoulders -->
    <path d="M100 800c0-105 98-176 220-176s220 71 220 176z" fill="#123256" opacity="0.82"/>

    <!-- Head -->
    <circle cx="320" cy="330" r="126" fill="#123256" opacity="0.82"/>

    <!-- Collar detail in teal -->
    <path d="M320 624l-52 88-26-64 34-30zM320 624l52 88 26-64-34-30z" fill="#0f7b7b" opacity="0.9"/>

    <!-- Gold baseline accent -->
    <rect x="0" y="788" width="640" height="12" fill="#c8a24a"/>
  </g>

  <rect x="1" y="1" width="638" height="798" rx="16" ry="16" fill="none" stroke="#cbd2dc" stroke-width="2"/>
</svg>
