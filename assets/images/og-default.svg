<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="H.R. Legal Associate — Advocates, Lucknow, Uttar Pradesh">
  <!--
    Default social-sharing card, 1200x630. Typographic on the brand navy:
    there is no photograph of the office or of the advocates, and a stock
    photograph on a card carrying the firm's name would imply one. The
    PNG served to social platforms is rendered from this file by
    tools/build-assets.js.
  -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#081c2c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#b78b4a"/>

  <rect x="88" y="120" width="96" height="96" rx="8" fill="#102a43" stroke="#b78b4a" stroke-width="2"/>
  <text x="136" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700"
        text-anchor="middle" fill="#ffffff">HR</text>

  <text x="88" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700"
        fill="#ffffff">H.R. Legal Associate</text>

  <text x="88" y="392" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="600"
        letter-spacing="4" fill="#d8c39a">LEGAL, PROPERTY, CORPORATE &amp; TAX SERVICES</text>

  <rect x="88" y="436" width="120" height="2" fill="#b78b4a"/>

  <text x="88" y="500" font-family="Helvetica, Arial, sans-serif" font-size="30"
        fill="#8494a5">Advocates in Lucknow, assisting clients across Uttar Pradesh</text>

  <text x="88" y="562" font-family="Helvetica, Arial, sans-serif" font-size="24"
        fill="#62717d">lexlawandtax.com</text>
</svg>
